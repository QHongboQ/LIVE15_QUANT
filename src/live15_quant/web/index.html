<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>LIVE15 Control Center</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/assets/app.css">
  <script src="/assets/app.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="#/" aria-label="LIVE15 dashboard">
        <span class="brand-mark">L15</span>
        <span><strong>LIVE15</strong><small>CONTROL CENTER</small></span>
      </a>
      <nav aria-label="Primary navigation">
        <div class="nav-group"><span class="nav-label">Overview</span>
          <a href="#/dashboard" data-route="dashboard"><span aria-hidden="true">⌁</span>Dashboard</a>
          <a href="#/markets" data-route="markets"><span aria-hidden="true">◇</span>Markets</a>
        </div>
        <div class="nav-group"><span class="nav-label">Data</span>
          <a href="#/data" data-route="data"><span aria-hidden="true">▥</span>Data Pipeline</a>
          <a href="#/training" data-route="training"><span aria-hidden="true">▤</span>Training Truth</a>
          <a href="#/archive" data-route="archive"><span aria-hidden="true">◫</span>Archive</a>
          <a href="#/storage" data-route="storage"><span aria-hidden="true">▱</span>Storage</a>
        </div>
        <div class="nav-group"><span class="nav-label">Operations</span>
          <a href="#/operations" data-route="operations"><span aria-hidden="true">◈</span>Operations</a>
          <a href="#/events" data-route="events"><span aria-hidden="true">⚠</span>Warnings / Errors</a>
          <a href="#/system" data-route="system"><span aria-hidden="true">◎</span>System / Health</a>
        </div>
      </nav>
      <div class="sidebar-foot">
        <span class="status-line" id="sidebar-status"><span class="status-icon">○</span>Connecting</span>
        <span>Read-only · localhost</span>
      </div>
    </aside>

    <main>
      <header class="topbar">
        <div>
          <p class="eyebrow" id="page-eyebrow">OVERVIEW</p>
          <h1 id="page-title">Dashboard</h1>
        </div>
        <div class="topbar-meta">
          <span id="last-refresh">Waiting for data</span>
          <span class="read-only"><span aria-hidden="true">◉</span> READ ONLY</span>
        </div>
      </header>

      <div id="global-notice" class="notice hidden" role="status"></div>
      <section id="view" aria-live="polite" aria-busy="true">
        <div class="loading-panel"><span class="spinner" aria-hidden="true"></span>Loading local data…</div>
      </section>
    </main>
  </div>
  <noscript><div class="noscript">LIVE15 Control Center requires JavaScript to render typed API data.</div></noscript>
</body>
</html>
