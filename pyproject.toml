[build-system]
requires = ["setuptools==82.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "live15-quant"
version = "0.1.0"
description = "Kalshi-native 15-minute prediction-market data and local paper execution"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "LicenseRef-Proprietary"
authors = [{ name = "LIVE15_QUANT contributors" }]
dependencies = [
    "cryptography==50.0.0",
    "fastapi==0.141.1",
    "requests==2.34.2",
    "uvicorn==0.52.4",
    "websockets==17.0.1",
]

[project.optional-dependencies]
dev = [
    "httpx==0.28.1",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.3",
]

[project.scripts]
live15-rest = "live15_quant.cli:rest_main"
live15-stream = "live15_quant.cli:stream_main"
live15-btc-stream = "live15_quant.cli:btc_stream_main"
live15-discover = "live15_quant.cli:discover_main"
live15-record = "live15_quant.cli:recorder_main"
live15-paper = "live15_quant.cli:paper_main"
live15-kalshi-demo-audit = "live15_quant.cli:kalshi_demo_audit_main"
live15-dataset = "live15_quant.cli:dataset_main"
live15-coverage = "live15_quant.cli:coverage_main"
live15-status = "live15_quant.cli:status_main"
live15-readiness = "live15_quant.cli:readiness_main"
live15-ui = "live15_quant.control_center:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
live15_quant = ["web/*.html", "web/*.css", "web/*.js"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "smoke: tests that access public external services",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "UP"]
