[build-system]
requires = ["setuptools==82.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "live15-quant"
version = "0.1.0"
description = "Kalshi-native 15-minute prediction-market data and local paper execution"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "LicenseRef-Proprietary"
authors = [{ name = "LIVE15_QUANT contributors" }]
dependencies = [
    "cryptography==50.0.0",
    "fastapi==0.141.1",
    "intel-openmp==2026.1.1; sys_platform == 'win32'",
    "kalshi-sdk==12.0.0",
    "numpy==2.5.2",
    "requests==2.34.2",
    "tzdata==2026.3",
    "uvicorn==0.52.4",
    "websockets==17.0.1",
    "xgboost==3.4.1",
]

[project.optional-dependencies]
dev = [
    "httpx==0.28.1",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.3",
]

[project.scripts]
live15-rest = "live15_quant.cli:rest_main"
live15-stream = "live15_quant.cli:stream_main"
live15-btc-stream = "live15_quant.cli:btc_stream_main"
live15-discover = "live15_quant.cli:discover_main"
live15-record = "live15_quant.cli:recorder_main"
live15-recorder-reconnect = "live15_quant.cli:recorder_reconnect_main"
live15-recorder-reconnect-rearm = "live15_quant.cli:recorder_reconnect_rearm_main"
live15-paper = "live15_quant.cli:paper_main"
live15-paper-shadow = "live15_quant.cli:paper_shadow_main"
live15-kalshi-demo-audit = "live15_quant.cli:kalshi_demo_audit_main"
live15-demo-diagnostic-watch = "live15_quant.cli:demo_diagnostic_watch_main"
live15-demo-first-fill = "live15_quant.cli:demo_first_fill_main"
live15-sdk-reliability-shadow = "live15_quant.managed_sdk_reliability_shadow:main"
live15-dataset = "live15_quant.cli:dataset_main"
live15-dataset-v1 = "live15_quant.cli:certified_dataset_v1_main"
live15-model-zoo = "live15_quant.cli:model_zoo_main"
live15-model-zoo-v2 = "live15_quant.cli:model_zoo_v2_main"
live15-model-v3-structured = "live15_quant.cli:model_v3_structured_main"
live15-coverage = "live15_quant.cli:coverage_main"
live15-status = "live15_quant.cli:status_main"
live15-readiness = "live15_quant.cli:readiness_main"
live15-latency-benchmark = "live15_quant.cli:latency_benchmark_main"
live15-secondary-diagnostics = "live15_quant.cli:secondary_diagnostics_main"
live15-storage-audit = "live15_quant.cli:storage_audit_main"
live15-ws-retention = "live15_quant.cli:ws_retention_main"
live15-archive-maintenance = "live15_quant.cli:archive_maintenance_main"
live15-adaptive-retention = "live15_quant.cli:adaptive_retention_main"
live15-research-preflight = "live15_quant.cli:research_preflight_main"
live15-ui = "live15_quant.control_center:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
live15_quant = ["terminal/*.html", "terminal/assets/*"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
asyncio_mode = "auto"
cache_dir = "runtime/tmp/pytest-cache"
pythonpath = ["src", "."]
testpaths = ["tests"]
markers = [
    "smoke: tests that access public external services",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "UP"]
