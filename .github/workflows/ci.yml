name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked dependencies
        run: |
          python -m pip install pip==26.2.1
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
          python -m pip check
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Import check
        run: python -c "import live15_quant; import live15_quant.execution; import live15_quant.providers.coinbase; import live15_quant.providers.kalshi; import live15_quant.providers.robinhood_15min; import live15_quant.recorder; import live15_quant.records; import live15_quant.replay; import live15_quant.risk; import live15_quant.storage; import live15_quant.settlement; import btc_price_test; import btc_stream; import market_stream"
      - name: Test
        run: pytest
