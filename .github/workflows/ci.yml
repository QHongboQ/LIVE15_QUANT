name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  plan:
    name: Plan validation
    runs-on: windows-latest
    outputs:
      tier: ${{ steps.plan.outputs.tier }}
      groups: ${{ steps.plan.outputs.groups }}
      full_suite: ${{ steps.plan.outputs.full_suite }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: plan
        name: Classify changed paths
        shell: pwsh
        run: |
          $pathsFile = Join-Path $PWD '.ci-changed-paths'
          $forceFull = $false
          if ('${{ github.event_name }}' -eq 'pull_request') {
            git diff --name-only 'origin/${{ github.base_ref }}...${{ github.sha }}' | Set-Content -LiteralPath $pathsFile -Encoding utf8
          } elseif ('${{ github.event_name }}' -eq 'push' -and '${{ github.event.before }}' -notmatch '^0+$') {
            git diff --name-only '${{ github.event.before }}' '${{ github.sha }}' | Set-Content -LiteralPath $pathsFile -Encoding utf8
          } else {
            Set-Content -LiteralPath $pathsFile -Value '' -Encoding utf8
            $forceFull = $true
          }
          $env:PYTHONPATH = 'src'
          $arguments = @('-m', 'live15_quant.ci_plan', '--event', '${{ github.event_name }}', '--ref', '${{ github.ref }}', '--changed-paths-file', $pathsFile, '--github-output', $env:GITHUB_OUTPUT)
          if ($forceFull) { $arguments += '--force-full' }
          & python @arguments

  static:
    name: Static checks
    needs: plan
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned static tooling
        run: |
          python -m pip install pip==26.2.1
          python -m pip install ruff==0.16.3
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Build deterministic release frontend
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pnpmVersion = '11.19.0'

          function Invoke-Native {
            param(
              [Parameter(Mandatory)] [string] $Label,
              [Parameter(Mandatory)] [scriptblock] $Command
            )

            & $Command
            if ($LASTEXITCODE -ne 0) {
              throw "$Label failed with exit code $LASTEXITCODE"
            }
          }

          Invoke-Native 'Corepack enable' { corepack enable }
          Invoke-Native "Corepack install pnpm@$pnpmVersion" { corepack install --global "pnpm@$pnpmVersion" }

          $actualPnpmVersion = & pnpm --version
          if ($LASTEXITCODE -ne 0) {
            throw "pnpm --version failed with exit code $LASTEXITCODE"
          }
          if ($actualPnpmVersion.Trim() -ne $pnpmVersion) {
            throw "Pinned pnpm mismatch: expected $pnpmVersion, got $actualPnpmVersion"
          }
          Write-Host "pnpm version = $actualPnpmVersion"

          Push-Location frontend
          try {
            Invoke-Native 'pnpm install --frozen-lockfile' { pnpm install --frozen-lockfile }
            Invoke-Native 'pnpm run typecheck' { pnpm run typecheck }
            Invoke-Native 'pnpm run lint' { pnpm run lint }
            Invoke-Native 'pnpm run build:release' { pnpm run build:release }
          }
          finally {
            Pop-Location
          }

          Invoke-Native 'Verify deterministic terminal bundle' { git diff --exit-code -- src/live15_quant/terminal }
      - name: Verify wheel owns terminal bundle
        shell: pwsh
        run: |
          python -m pip install setuptools==82.0.0
          python -m pip wheel --no-deps --no-build-isolation --wheel-dir runtime/wheels .
          $wheel = Get-ChildItem runtime/wheels/*.whl | Select-Object -First 1
          @'
          import sys
          from zipfile import ZipFile
          with ZipFile(sys.argv[1]) as wheel:
              names = wheel.namelist()
          assert any(name.startswith("live15_quant/terminal/assets/") and name.endswith(".js") for name in names)
          assert "live15_quant/terminal/index.html" in names
          assert not any(name.startswith("live15_quant/web/") for name in names)
          '@ | python - $wheel.FullName
      - name: Diff integrity
        run: git diff --check HEAD^ HEAD

  governance:
    name: Governance tests
    needs: plan
    if: ${{ needs.plan.outputs.full_suite != 'true' && contains(needs.plan.outputs.groups, 'governance') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install governance test tooling
        run: |
          python -m pip install pip==26.2.1
          python -m pip install pytest==9.1.1 pytest-asyncio==1.4.0
      - name: Project context tests
        env:
          PYTHONPATH: src
        run: pytest tests/test_agent_context.py

  control-center:
    name: Control Center tests
    needs: plan
    if: ${{ needs.plan.outputs.full_suite != 'true' && contains(needs.plan.outputs.groups, 'control-center') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked dependencies
        run: |
          python -m pip install pip==26.2.1
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
          python -m pip check
      - name: Import check
        run: python tools/ci_import_check.py
      - name: Control Center tests
        run: pytest tests/test_control_center.py

  recorder-ws:
    name: Recorder and WS tests
    needs: plan
    if: ${{ needs.plan.outputs.full_suite != 'true' && contains(needs.plan.outputs.groups, 'recorder-ws') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked dependencies
        run: |
          python -m pip install pip==26.2.1
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
          python -m pip check
      - name: Import check
        run: python tools/ci_import_check.py
      - name: Recorder and WS tests
        run: pytest tests/test_recorder.py tests/test_recorder_control.py tests/test_ws_retention.py tests/test_kalshi_ws.py tests/test_kalshi_ws_recorder.py

  data-storage:
    name: Data and storage tests
    needs: plan
    if: ${{ needs.plan.outputs.full_suite != 'true' && contains(needs.plan.outputs.groups, 'data-storage') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked dependencies
        run: |
          python -m pip install pip==26.2.1
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
          python -m pip check
      - name: Import check
        run: python tools/ci_import_check.py
      - name: Data and storage tests
        run: pytest tests/test_storage.py tests/test_gaps.py tests/test_dataset.py tests/test_ws_retention.py

  research-model:
    name: Research and model tests
    needs: plan
    if: ${{ needs.plan.outputs.full_suite != 'true' && contains(needs.plan.outputs.groups, 'research-model') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked dependencies
        run: |
          python -m pip install pip==26.2.1
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
          python -m pip check
      - name: Import check
        run: python tools/ci_import_check.py
      - name: Research and model tests
        run: |
          $modelTests = @(
            Get-ChildItem -LiteralPath tests -Filter 'test_model*.py' -File |
              Sort-Object Name |
              ForEach-Object { $_.FullName }
          )
          if ($modelTests.Count -eq 0) {
            throw 'No model tests matched tests/test_model*.py'
          }
          $tests = @(
            'tests/test_research_data_authority.py'
            'tests/test_historical_research.py'
            'tests/test_historical_bulk.py'
            'tests/test_factor_factory.py'
            'tests/test_factor001r.py'
            'tests/test_sequence_readiness.py'
          ) + $modelTests
          & pytest @tests
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

  full:
    name: Full regression suite
    needs: plan
    if: ${{ needs.plan.outputs.full_suite == 'true' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked dependencies
        run: |
          python -m pip install pip==26.2.1
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
          python -m pip check
      - name: Import check
        run: python tools/ci_import_check.py
      - name: Full test suite
        run: pytest

  ci-gate:
    name: CI Gate
    if: ${{ always() }}
    needs: [plan, static, governance, control-center, recorder-ws, data-storage, research-model, full]
    runs-on: windows-latest
    env:
      PLAN_RESULT: ${{ needs.plan.result }}
      GROUPS: ${{ needs.plan.outputs.groups }}
      FULL_SUITE: ${{ needs.plan.outputs.full_suite }}
      STATIC_RESULT: ${{ needs.static.result }}
      GOVERNANCE_RESULT: ${{ needs.governance.result }}
      CONTROL_CENTER_RESULT: ${{ needs['control-center'].result }}
      RECORDER_WS_RESULT: ${{ needs['recorder-ws'].result }}
      DATA_STORAGE_RESULT: ${{ needs['data-storage'].result }}
      RESEARCH_MODEL_RESULT: ${{ needs['research-model'].result }}
      FULL_RESULT: ${{ needs.full.result }}
    steps:
      - name: Enforce planned validation
        shell: pwsh
        run: |
          if ($env:PLAN_RESULT -ne 'success') { throw 'CI planner did not succeed' }
          if ($env:STATIC_RESULT -ne 'success') { throw 'Static checks did not succeed' }
          $results = @{
            'governance' = $env:GOVERNANCE_RESULT
            'control-center' = $env:CONTROL_CENTER_RESULT
            'recorder-ws' = $env:RECORDER_WS_RESULT
            'data-storage' = $env:DATA_STORAGE_RESULT
            'research-model' = $env:RESEARCH_MODEL_RESULT
            'full' = $env:FULL_RESULT
          }
          $required = if ($env:FULL_SUITE -eq 'true') { @('full') } else { @($env:GROUPS -split ',' | Where-Object { $_ }) }
          foreach ($job in $required) {
            if ($results[$job] -ne 'success') { throw "Required CI job did not succeed: $job ($($results[$job]))" }
          }
